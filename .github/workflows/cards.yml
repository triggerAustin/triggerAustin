name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&layout=compact&langs_count=8&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        run: |
          mkdir -p profile
          URL="https://github-readme-streak-stats-eight.vercel.app?user=${{ github.repository_owner }}&theme=nightowl"
          if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 "$URL" -o profile/streak.tmp \
             && grep -q "<svg" profile/streak.tmp; then
            mv profile/streak.tmp profile/streak.svg
            echo "Streak card updated"
          else
            echo "::warning::Streak service unavailable, keeping previous streak.svg"
            rm -f profile/streak.tmp
          fi
          
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
